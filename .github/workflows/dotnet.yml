# This workflow builds a BepInEx plugin and creates releases
name: Build and Release

on:
  push:
    branches: [ "dev" ] # 只有 dev 分支的每次 push 都会触发构建
    tags: [ "v*" ] # 推送 tag 时构建并创建 Release（从 main 打 tag）
  pull_request:
    branches: [ "dev" ] # 只有 dev 分支的 PR 才触发构建

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写入权限来创建 Release

    steps:
    - uses: actions/checkout@v4

    - name: Generate Time-based Version
      id: gen_version
      run: |
        VERSION="v$(date -u +%Y.%m.%d-%H%M%S)"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # 安装必要的 .NET SDK 版本
        dotnet-version: |
          8.0.x 
          6.0.x 

    - name: Restore dependencies
      # 使用解决方案文件进行还原
      run: dotnet restore ./BepInEx-TTFLoaderPlugin.sln

    - name: Build
      # 编译整个解决方案，使用 Release 配置
      run: dotnet build ./BepInEx-TTFLoaderPlugin.sln --no-restore -c Release

    - name: Find and Copy DLL files
      id: find_dlls_and_copy
      run: |
        # 创建 artifact 目录
        mkdir -p artifacts
        
        # 查找 IL2CPP DLL 并复制
        DLL_IL2CPP=$(find . -name "TTFLoaderIL2CPP.dll" -path "*/Release/*" | head -n 1)
        if [ -z "$DLL_IL2CPP" ]; then
          echo "TTFLoaderIL2CPP.dll not found!"
          exit 1
        fi
        echo "Found TTFLoaderIL2CPP.dll at: $DLL_IL2CPP"
        cp "$DLL_IL2CPP" artifacts/
        
        # 查找 Mono DLL 并复制
        DLL_MONO=$(find . -name "TTFLoaderMono.dll" -path "*/Release/*" | head -n 1)
        if [ -z "$DLL_MONO" ]; then
          echo "TTFLoaderMono.dll not found!"
          exit 1
        fi
        echo "Found TTFLoaderMono.dll at: $DLL_MONO"
        cp "$DLL_MONO" artifacts/
        
        # 移除 README 和 LICENSE 复制步骤

    - name: Upload Artifacts
      # 上传构建产物，以便在 workflow 运行结束后下载检查
      uses: actions/upload-artifact@v4
      with:
        name: TTFLoader-MultiTarget-${{ steps.gen_version.outputs.version }}
        path: artifacts/

    - name: Create Release
      # 仅在 Tag 推送时执行
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        # 将 artifacts 目录下的所有 DLL 文件作为附件上传到 Release
        files: artifacts/*.dll
        name: TTFLoader ${{ steps.gen_version.outputs.version }}
        body: |
          ## TTFLoader ${{ steps.gen_version.outputs.version }}
          
          此版本包含针对 IL2CPP 和 Mono 目标框架的 DLL 文件。
          请根据您的游戏环境选择对应的 DLL 文件！
          
          ### 文件说明
          - **`TTFLoaderIL2CPP.dll`**: 适用于使用 **IL2CPP** 脚本后端游戏的 BepInEx。
          - **`TTFLoaderMono.dll`**: 适用于使用 **Mono** 脚本后端游戏的 BepInEx。
          
          ### 安装
          1. 下载对应您游戏环境的 DLL 文件。
          2. 复制到您的游戏 `BepInEx/plugins/` 文件夹。
          3. 将 `.ttf` 字体文件放在游戏根目录。
          
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
