# This workflow builds a BepInEx plugin and creates releases
name: Build and Release

on:
  push:
    branches: [ "dev" ] # 只有 dev 分支的每次 push 都会触发构建
    tags: [ "v*" ] # 推送 tag 时构建并创建 Release（从 main 打 tag）
  pull_request:
    branches: [ "dev" ] # 只有 dev 分支的 PR 才触发构建

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写入权限来创建 Release

    steps:
    - uses: actions/checkout@v4

    - name: Generate Time-based Version
      id: gen_version
      run: |
        VERSION="v$(date -u +%Y.%m.%d-%H%M%S)"
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Generated version: $VERSION"

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # 安装必要的 .NET SDK 版本
        dotnet-version: |
          8.0.x 
          6.0.x 

    - name: Restore dependencies
      # 使用解决方案文件进行还原
      run: dotnet restore ./BepInEx-TTFLoaderPlugin.sln

    - name: Build
      # 编译整个解决方案，使用 Release 配置
      run: dotnet build ./BepInEx-TTFLoaderPlugin.sln --no-restore -c Release

    - name: Find and Copy DLL files
      id: find_dlls_and_copy
      run: |
        # 创建 artifact 目录
        mkdir -p artifacts
        
        # 查找 IL2CPP DLL 并复制
        # -not -path "*/ref/*" 排除 ref/ 引用程序集：ref dll 只有类型签名、无 IL，
        # 若被 head -n 1 选中打包，BepInEx 加载会报 0x80131058。
        DLL_IL2CPP=$(find . -name "TTFLoaderIL2CPP.dll" -path "*/Release/*" -not -path "*/ref/*" | head -n 1)
        if [ -z "$DLL_IL2CPP" ]; then
          echo "TTFLoaderIL2CPP.dll not found!"
          exit 1
        fi
        echo "Found TTFLoaderIL2CPP.dll at: $DLL_IL2CPP"
        cp "$DLL_IL2CPP" artifacts/
        
        # 查找 Mono DLL 并复制（同样排除 ref/ 引用程序集）
        DLL_MONO=$(find . -name "TTFLoaderMono.dll" -path "*/Release/*" -not -path "*/ref/*" | head -n 1)
        if [ -z "$DLL_MONO" ]; then
          echo "TTFLoaderMono.dll not found!"
          exit 1
        fi
        echo "Found TTFLoaderMono.dll at: $DLL_MONO"
        cp "$DLL_MONO" artifacts/
        
        # 移除 README 和 LICENSE 复制步骤

    - name: Verify DLLs are not reference assemblies
      # 兜底校验：引用程序集（ref/）没有 IL 代码，误打包会导致 BepInEx 加载失败
      # (BadImageFormatException 0x80131058)。校验 PE COR 头的 REF_ASSEMBLY 位(0x400000)。
      run: |
        python3 - <<'PY'
        import sys, struct
        def is_ref(path):
            b = open(path, 'rb').read()
            if b[0:2] != b'MZ':
                return True
            e = struct.unpack_from('<I', b, 0x3C)[0]
            if b[e:e+4] != b'PE\x00\x00':
                return True
            coff = e + 4
            nsec = struct.unpack_from('<H', b, coff + 2)[0]
            optsize = struct.unpack_from('<H', b, coff + 16)[0]
            opt = coff + 20
            magic = struct.unpack_from('<H', b, opt)[0]
            dd = opt + (112 if magic == 0x20b else 96)
            cli_rva, _ = struct.unpack_from('<II', b, dd + 14 * 8)
            if cli_rva == 0:
                return True
            sec = opt + optsize
            secs = []
            for i in range(nsec):
                o = sec + i * 40
                vsize = struct.unpack_from('<I', b, o + 8)[0]
                vaddr = struct.unpack_from('<I', b, o + 12)[0]
                rawsize = struct.unpack_from('<I', b, o + 16)[0]
                rawoff = struct.unpack_from('<I', b, o + 20)[0]
                secs.append((vaddr, vsize, rawoff, rawsize))
            off = None
            for (va, vs, ro, rs) in secs:
                if va <= cli_rva < va + max(vs, rs):
                    off = ro + (cli_rva - va)
                    break
            if off is None:
                return True
            flags = struct.unpack_from('<I', b, off + 16)[0]
            return bool(flags & 0x00400000)
        ok = True
        for p in ['artifacts/TTFLoaderIL2CPP.dll', 'artifacts/TTFLoaderMono.dll']:
            r = is_ref(p)
            print(f"{p}: reference_assembly={r}")
            if r:
                ok = False
        if not ok:
            print("ERROR: 检测到引用程序集（ref dll），它不能用于运行，构建失败。")
            sys.exit(1)
        print("OK: 所有 DLL 均为可执行程序集（非 ref）。")
        PY

    - name: Upload Artifacts
      # 上传构建产物，以便在 workflow 运行结束后下载检查
      uses: actions/upload-artifact@v4
      with:
        name: TTFLoader-MultiTarget-${{ steps.gen_version.outputs.version }}
        path: artifacts/

    - name: Create Release
      # 仅在 Tag 推送时执行
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        # 将 artifacts 目录下的所有 DLL 文件作为附件上传到 Release
        files: artifacts/*.dll
        name: TTFLoader ${{ steps.gen_version.outputs.version }}
        body: |
          ## TTFLoader ${{ steps.gen_version.outputs.version }}
          
          此版本包含针对 IL2CPP 和 Mono 目标框架的 DLL 文件。
          请根据您的游戏环境选择对应的 DLL 文件！
          
          ### 文件说明
          - **`TTFLoaderIL2CPP.dll`**: 适用于使用 **IL2CPP** 脚本后端游戏的 BepInEx。
          - **`TTFLoaderMono.dll`**: 适用于使用 **Mono** 脚本后端游戏的 BepInEx。
          
          ### 安装
          1. 下载对应您游戏环境的 DLL 文件。
          2. 复制到您的游戏 `BepInEx/plugins/` 文件夹。
          3. 将 `.ttf` 字体文件放在游戏根目录。
          
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
